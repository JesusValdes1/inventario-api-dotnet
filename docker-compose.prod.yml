services:

  postgres:
    image: postgres:16
    container_name: inventario-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - inventario_postgres_data:/var/lib/postgresql/data


  migrations:
    build:
      context: .
      dockerfile: Dockerfile.migrations

    image: inventario-migrations

    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}

    depends_on:
      - postgres

    profiles:
      - migration


  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: inventario-api
    container_name: inventario-api
    restart: unless-stopped

    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}

    depends_on:
      - postgres


  frontend:
    build:
      context: ./inventario-frontend
      dockerfile: Dockerfile

      args:
        VITE_API_BASE_URL: /api

    image: inventario-frontend
    container_name: inventario-frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - api


volumes:
  inventario_postgres_data: